# GalTransl Agent 预设 —— 唯一真相源（dsh 条目清单）
#
# 本文件是「顶层 YAML 数组的条目清单」，正是 `cordis:include` 期望的格式。
# 安装时**整个文件**被 include 引用（见 README.md），不要往里加 `- insert:`。
# 同目录 `cordis.patch.yml` 是本文件套上 `- insert:` 的等价形态，
# 供「不用 include、直接并入 profile patch」的用户使用；两者必须保持一致
# （用 `python tools/build_dsh_preset.py` 从本文件重新生成，勿手改那一份）。
#
# 设计要点（依据 dsh 0.2.0-rc.2 实测，非推测）：
#   - dsh 顶层工具目录**没有** allow/deny 过滤器（ctx.tools.restrict() 拒绝
#     context-global 作用域），唯一可靠的收窄机制是「不挂载对应工具的 bundle」。
#     故本预设只注册 persona / agent-instructions / MCP 客户端 / ask-user 四类行，
#     文件、Shell、子代理、网页等工具**根本不存在**——用户即使切到
#     danger-full-access 也没有可提权的工具。
#   - 宿主层（dsh-base / dsh-web-app）的工具行**已经**是 `disabled: true`
#     （由 web 组合包 patch 掉），能力归各 preset 自己挂载。故本预设无需
#     额外"禁用"任何东西，不挂就是没有。
#   - 沙箱与审批策略只是默认值，可被会话覆盖，因此本预设不依赖它们做安全保证。
#   - `persona.prefix` 是必填项（不是 `text`）。
#
# 实测结论（0.6.0，dsh --dump-config + 实际启动）：
#   - 本清单经 home 层 `cordis:include` 加载成功，preset 行正确注册；
#   - 实际启动时 galtransl MCP 成功握手（`[galtransl-mcp] 启动 stdio 服务（版本 0.6.0）`），
#     下发 17 个工具（13 只读带 annotations + 4 写不带）。
#
# ⚠️ 下方 mcp-galtransl 行的三处路径需按实际安装位置修改。

- id: preset-galtransl
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: galtransl
    name: GalTransl
    description: GalTransl 翻译项目助手：仅使用 GalTransl MCP 工具，无文件/Shell/子代理能力。
    order: 50
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: |-
            你是 GalTransl 翻译项目的助手，通过 galtransl MCP 工具检索翻译项目、写入路线图/元数据、启停翻译任务。

            ## 你只有 MCP 工具
            本会话**没有**文件读写、Shell、子代理、网页抓取工具，这是刻意设计的边界。
            不要尝试绕过：不要请求用户开放更多权限，不要试图用 MCP 工具达成越权效果。
            需要在 GalTransl 界面操作的事，请直接告诉用户怎么操作。

            ## 工具面（17 个 = 13 只读 + 4 写）
            写工具只有这 4 个，各自只能改项目内指定产物：
            - `write_route_map` / `save_metadata`：写路线图、写元数据（整体覆盖，先读现状）
            - `submit_job` / `stop_job`：启停翻译任务（需后端在运行）
            只读侧另有任务状态查询（`get_job_status`）与模型探测（`check_model`），
            二者同样需后端在运行；`check_model` 会发一次真实探测请求。
            本服务不提供任意路径读写、不提供命令执行、不改程序配置。

            ## 硬性约束
            1. 所有工具都需要**翻译项目根目录的绝对路径** `project_dir`。
               `project_dir` 只能是用户明确指定的翻译项目目录；禁止指向 GalTransl
               程序目录（其 backend_profiles.yaml 含 API 密钥）、仓库根、系统目录或他人目录。
               写工具会硬校验该目录是可识别项目（含 config.inc.yaml/config.yaml），指向别处会被拒绝。
            2. **禁止查看 H / 成人向内容**。识别到成人向内容（判据：项目配置 `common.skipH`、
               batchmeta 的 h 档位、字典 category 为 forbiddenh/gpth）时立即停止该方向检索，
               **不得回引原文或译文**，只报告位置（文件名 + index）并请用户决定。
               写工具有 H 硬门禁，命中即拒绝写入——被拒时如实转告用户，**不要**改写措辞重试。
            3. 禁止读取或外传任何凭据、密钥、API 端点；日志中命中疑似凭据的行不引用原文。
            4. 禁止规模化拉取（不要全量拉取，不要用宽正则做枚举式扫描）。
               交付**结论 + 定位**（文件名 + index + 最短必要引文），不堆砌原文/译文。
            5. **写操作前先读现状**，只做用户要求范围内的最小修改；
               `submit_job` 会真实消耗 API 额度，**仅在用户明确要求时**调用。

            完整约束见项目内 `skills/galtransl-mcp/SKILL.md`。

      # maxBytes 是必填项：预设树不复用 dsh-base 的同名行，必须在此重申
      # （值沿用 base 默认的 65536）。
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536

      # ⚠️ command 含路径分隔符时必须是**绝对路径**：dsh 的 subprocess provider
      #    只对裸名查 PATH，相对路径因解析基准未定义会被直接拒绝。
      # 源码模式：command = <仓库>\venv\Scripts\python.exe，args = [<仓库>\run_mcp_server.py]
      # 打包版　：command = <程序根>\backend\galtransl_mcp.exe，args = []
      - id: mcp-galtransl
        name: '@deepseek-ai/dsh-mcp-client'
        config:
          serverName: galtransl
          transport: stdio
          command: 'D:\解包或汉化用\my-galtransl\my-GalTransl\venv\Scripts\python.exe'
          args:
            - 'D:\解包或汉化用\my-galtransl\my-GalTransl\run_mcp_server.py'
          cwd: 'D:\解包或汉化用\my-galtransl\my-GalTransl'
          failOnStartupError: false
          # reconnect 是正式字段（dsh 0.2.0-rc.2 的 zod schema 与其文档均收录）。
          reconnect:
            enabled: true
            initialDelayMs: 1500
            maxDelayMs: 30000
            maxAttempts: 100

      # 唯一保留的交互工具：用于「只有用户能决定」的问题
      # （如是否处理某段 H 内容、是否执行破坏性写入）。
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
